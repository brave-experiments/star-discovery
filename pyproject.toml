[project]
name = "star-discovery"
authors = [{name = "Peter Snyder", email = "pes@brave.com"}]
license = "MIT"
readme = "README.md"
version = "0.2.4"
dependencies = [
    "beautifulsoup4==4.15.0",
    "packaging==26.2",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "mypy==2.1.0",
    "pylint==4.0.6",
    "pytest==9.1.1",
    "types-tabulate==0.10.0.20260508",
]

[tool.mypy]
strict = true

[tool.black]
line-length = 88

[tool.setuptools.packages.find]
where = ['src']

[project.scripts]
star-discovery = "star_discovery.cli.parser:run"

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "tests/*.py",
]
